<polyline data-flow="StateFlow_14" points="1435.0,745.0 1435.0,785.0" fill="none" stroke="#42536c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="185.5" y="323.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="185.5" dy="0">Запрос принят</tspan></text>
<text x="640.0" y="323.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="640.0" dy="0">Склад принял</tspan></text>
<text x="1270.5" y="357.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="1270.5" dy="0">Вариант подобран¹</tspan></text>
<text x="1215.0" y="305.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="1215.0" dy="0">Ошибка готовности¹</tspan></text>
<text x="915.0" y="231.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="915.0" dy="0">Запрос отмены /</tspan><tspan x="915.0" dy="18.2">флаг = true</tspan></text>
<text x="1530.0" y="231.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="1530.0" dy="0">Запрос отмены /</tspan><tspan x="1530.0" dy="18.2">флаг = true</tspan></text>
<text x="278.0" y="703.4" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="278.0" dy="0">Отмена продавцом;</tspan><tspan x="278.0" dy="18.2">причина обязательна</tspan></text>
<text x="855.0" y="533.4" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="855.0" dy="0">Поиск без</tspan><tspan x="855.0" dy="18.2">результата¹</tspan></text>
<text x="1001.0" y="666.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="1001.0" dy="0">Подтверждение</tspan><tspan x="1001.0" dy="18.2">отмены²</tspan></text>
<text x="1725.0" y="322.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="1725.0" dy="0">Подтверждение</tspan><tspan x="1725.0" dy="18.2">отмены²</tspan></text>
<text x="1466.0" y="487.8" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="1466.0" dy="0">Фактическая</tspan><tspan x="1466.0" dy="18.2">передача</tspan><tspan x="1466.0" dy="18.2">подтверждена</tspan></text>
<text x="1105.0" y="374.9" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d2c42"><tspan x="1105.0" dy="0">Передача при</tspan><tspan x="1105.0" dy="18.2">спорной отмене³</tspan></text>
<rect data-state="Created" x="250" y="295.0" width="230" height="90" rx="13" fill="#edf4ff" stroke="#7d9cc9" stroke-width="1.8"/>
<text x="365.0" y="345.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1d2c42"><tspan x="365.0" dy="0">Создан</tspan></text>
<rect data-state="Working" x="800" y="295.0" width="230" height="90" rx="13" fill="#edf4ff" stroke="#7d9cc9" stroke-width="1.8"/>
<text x="915.0" y="345.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1d2c42"><tspan x="915.0" dy="0">В работе</tspan></text>
<rect data-state="Ready" x="1400" y="295.0" width="260" height="90" rx="13" fill="#edf4ff" stroke="#7d9cc9" stroke-width="1.8"/>
<text x="1530.0" y="345.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1d2c42"><tspan x="1530.0" dy="0">Готов к передаче</tspan></text>
<rect data-state="NotFound" x="440" y="655.0" width="230" height="90" rx="13" fill="#edf4ff" stroke="#7d9cc9" stroke-width="1.8"/>
<text x="555.0" y="705.0" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1d2c42"><tspan x="555.0" dy="0">Не найдено</tspan></text>
<circle cx="555.0" cy="800.0" r="15" fill="white" stroke="#34527c" stroke-width="2"/><circle cx="555.0" cy="800.0" r="9" fill="#34527c"/>
