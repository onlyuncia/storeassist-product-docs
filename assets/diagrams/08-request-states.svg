<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1380" viewBox="0 0 1900 1380" role="img" aria-labelledby="title desc"><title id="title">TO-BE · состояния запроса</title><desc id="desc">Активные состояния и три финальных исхода. Ожидающая отмена является признаком.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#42536c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="35" y="40.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="650" fill="#1d2c42"><tspan x="35" dy="0">TO-BE · состояния запроса</tspan></text>
<text x="35" y="78.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#607087"><tspan x="35" dy="0">Один запрос — один вариант и одна единица. Три финальных исхода не переписываются.</tspan></text>
<rect x="35" y="130" width="1830" height="480" rx="15" fill="#f7f9fc" stroke="#b5c6db"/>
<text x="60" y="165.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2c42"><tspan x="60" dy="0">Активный запрос</tspan></text>
