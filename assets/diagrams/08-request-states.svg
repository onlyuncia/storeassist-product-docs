<circle cx="1435.0" cy="800.0" r="15" fill="white" stroke="#34527c" stroke-width="2"/><circle cx="1435.0" cy="800.0" r="9" fill="#34527c"/>
<circle cx="110.0" cy="340.0" r="11" fill="#34527c"/>
<text x="35" y="1230.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="35" dy="0">¹ Нет ожидающей отмены. При отмене ненужный поиск не продолжается; сначала разрешается положение вещи.</tspan></text>
<text x="35" y="1259.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="35" dy="0">² Положение вещи урегулировано, итог сохраняет текущий складской исполнитель. При фактической передаче — «Передан».</tspan></text>
<text x="35" y="1288.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="35" dy="0">³ Из «В работе» в «Передан» — только при ожидающей отмене и подтверждённом факте передачи по FR-10; готовность не предполагается.</tspan></text>
<text x="35" y="1317.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="35" dy="0">Отмена — признак активного запроса. С 5 минут — визуальная пометка. Передачи работы не меняют статус и время создания.</tspan></text>
<text x="35" y="1346.0" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="35" dy="0">Потеря ответа не создаёт нового статуса: сначала уточняется сохранённый результат. Комментарий к «Не найдено» необязателен.</tspan></text>
</svg>