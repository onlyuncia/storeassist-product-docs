<text x="32" y="1208.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="32" dy="0">Подтверждение предупреждения относится к выбранному варианту и текущей попытке; повторного чтения по кругу нет.</tspan></text>
<text x="32" y="1235.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="32" dy="0">Для альтернативы предварительно нужны выбор продавца и согласие покупателя; оно не заменяет подтверждение неизвестного наличия.</tspan></text>
<text x="32" y="1262.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="32" dy="0">Потеря ответа StoreAssist: уточнить сохранённый результат, повторить то же действие без дубля. Принятие не является резервом.</tspan></text>
