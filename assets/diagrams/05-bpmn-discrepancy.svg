<text x="32" y="1652.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="32" dy="0">Открытое обращение по тому же магазину и варианту дополняется эпизодом; прежний ответственный и время создания сохраняются.</tspan></text>
<text x="32" y="1679.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="32" dy="0">Старший закрывает только завершённую проверку с результатом. Его роль не предоставляет права менять учёт.</tspan></text>
<text x="32" y="1706.5" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#607087"><tspan x="32" dy="0">После проверки размещения и при открытии карточки адрес читается заново. Сбой: последнее значение с предупреждением; наблюдение отдельно.</tspan></text>
